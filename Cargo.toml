[package]
name = "polaris-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Uptime Polaris host monitoring agent"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
# 使用 rustls 和内置根证书，避免此 WebSocket 客户端依赖系统 OpenSSL 与证书目录。
# Use rustls and bundled roots to avoid system OpenSSL and certificate-store dependencies in this WebSocket client.
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-webpki-roots",
] }
rustls = { version = "0.23", default-features = false, features = [
    "logging",
    "tls12",
    "ring",
] }
webpki-roots = "1.0.10"
rustls-webpki = { version = "0.103.16", default-features = false }
sysinfo = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"
hex = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
futures-util = "0.3"
# Geography uses a separate direct client; reporting keeps its configured proxy.
# 地理信息使用独立直连客户端；上报仍使用已配置的代理。
ureq = { version = "2.10", features = ["json", "proxy-from-env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks", "http2", "system-proxy"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.18"
time = { version = "0.3", features = ["parsing", "formatting"] }
socket2 = { version = "0.6", features = ["all"] }

[dev-dependencies]
tokio = { version = "1.38", features = ["test-util"] }
rcgen = "0.12"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }

[lib]
name = "polaris_agent"
path = "src/lib.rs"

[[bin]]
name = "polaris-agent"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
codegen-units = 1
# 保留栈展开，使 main.rs 能捕获 WebSocket 会话的 panic 并进入重连流程。
# Keep unwinding so main.rs can catch WebSocket session panics and reconnect.
